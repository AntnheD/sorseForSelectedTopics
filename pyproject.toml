[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa"
version = "0.1.0"
description = "Transformer-powered, citation-grounded Q&A over FastAPI documentation (AAU Selected Topics in SE, Project 1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
docqa = "docqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: needs model downloads or several seconds (deselect with -m 'not slow')",
]
filterwarnings = ["ignore::DeprecationWarning"]
