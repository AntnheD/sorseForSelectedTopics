name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch, no model downloads)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install -e .
      - name: Preprocess the committed corpus
        run: python -m docqa preprocess
      - name: Unit tests and smoke path
        run: python -m pytest
      - name: No-download end-to-end smoke run
        run: >
          python -m docqa ask "How do I make a query parameter optional?"
          --set retrieval.method=bm25 --set generation.generator=extractive --set generation.min_retrieval_score=0
